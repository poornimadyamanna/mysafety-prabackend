name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in EC2_HOST EC2_USER DEPLOY_PATH SSH_KEY KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is missing or empty (check repository and production environment secrets)."
              exit 1
            fi
          done
          if [[ "$EC2_HOST" =~ [[:space:]] || "$EC2_HOST" == *://* || "$EC2_HOST" == *'/'* || "$EC2_HOST" == *':'* ]]; then
            echo '::error::EC2_HOST must be a plain IP address or DNS hostname (no scheme, port, path, or whitespace).'
            exit 1
          fi
          if [[ ! "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*[$]?$ ]]; then
            echo '::error::EC2_USER is not a valid Linux username.'
            exit 1
          fi
          echo 'Deployment secrets have valid basic formats.'

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || {
            echo '::error::EC2_SSH_KEY is not a readable, unencrypted SSH private key.'
            exit 1
          }
      - name: Verify SSH host configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail

          if [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_HOST is empty"
            exit 1
          fi

          if ! ssh-keygen -F "$EC2_HOST" \
            -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::No SSH host key entry matches EC2_HOST"
            exit 1
          fi

          echo "SSH host key entry exists"
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            bash -se -- "$DEPLOY_PATH" <<'EOF_REMOTE'
          set -e

          cd "$1"

          git fetch origin main
          git switch main
          git pull --ff-only origin main

          docker compose config -q
          docker compose up -d --build
          docker compose ps
          EOF_REMOTE
