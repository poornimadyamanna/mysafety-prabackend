
name: MySafety Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MySafety backend
        working-directory: ./My-Safety-Backend-main
        run: |
          docker build -t mysafety-backend:ci .
